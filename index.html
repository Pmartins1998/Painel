<!DOCTYPE html>

<head>

<title>Painel pessoal</title>
<style>
:root{color-scheme:light;--bg:#f1f1ef;--sup:#fcfcfb;--sup2:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--lin:#e1e0d9;--eixo:#c3c2b7;
  --s1:#2a78d6;--s2:#eb6834;--bom:#006300;--avi:#8a5a00;--cri:#b42f2f;--pri:#2f2f2d;--pri-ink:#fff}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d0d0d;--sup:#1a1a19;--sup2:#222220;--ink:#f0efec;--ink2:#c3c2b7;--mut:#898781;--lin:#2c2c2a;--eixo:#383835;
  --s1:#3987e5;--s2:#d95926;--bom:#0ca30c;--avi:#fab219;--cri:#e66767;--pri:#e4e3df;--pri-ink:#0d0d0d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:1120px;margin:0 auto;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:650}
header .data{color:var(--ink2);font-size:13px}
header .esp{flex:1}
.modo{font-size:12px;color:var(--ink2);border:1px solid var(--lin);border-radius:999px;padding:2px 10px;background:var(--sup)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--lin)}
nav .in{display:flex;gap:2px;overflow-x:auto;max-width:1120px;margin:0 auto;padding:6px 12px}
nav button{border:0;background:none;color:var(--ink2);padding:8px 12px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button[aria-current=page]{background:var(--sup);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--lin)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 64px}
.aviso{background:var(--sup);border:1px solid var(--lin);border-left:3px solid var(--mut);border-radius:8px;padding:10px 12px;margin:0 0 16px;color:var(--ink2);font-size:13px}
h2{font-size:16px;margin:26px 0 10px;font-weight:650}
h2:first-child{margin-top:0}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.cab{display:flex;align-items:center;gap:8px;margin:26px 0 10px;flex-wrap:wrap}
.cab h2{margin:0;flex:1}
.grelha{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.col2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cartao{background:var(--sup);border:1px solid var(--lin);border-radius:10px;padding:14px}
.tile .rot{color:var(--ink2);font-size:12.5px}
.tile .val{font-size:24px;font-weight:650;margin:2px 0;letter-spacing:-.01em}
.tile .sub{color:var(--mut);font-size:12.5px}
button,.btn{font:inherit}
.b{border:1px solid var(--lin);background:var(--sup);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.b:hover{background:var(--sup2)}
.b.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.b.mini{padding:3px 8px;font-size:12.5px}
.b.perigo{color:var(--cri)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;color:var(--ink2);font-weight:550;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--eixo);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--lin);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.vazio{color:var(--mut);font-size:13.5px;padding:6px 0}
.tag{display:inline-block;font-size:11.5px;color:var(--ink2);border:1px solid var(--lin);border-radius:999px;padding:0 8px;background:var(--sup2);white-space:nowrap}
.st{font-size:12.5px;white-space:nowrap}
.st.bom{color:var(--bom)}.st.avi{color:var(--avi)}.st.cri{color:var(--cri);font-weight:600}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--lin);font-size:13.5px}
.lista li:last-child{border-bottom:0}
.lista .h{color:var(--ink2);font-variant-numeric:tabular-nums;min-width:42px}
.lista .t{flex:1;min-width:0}
.item{all:unset;cursor:pointer;display:block;width:100%}
.item:hover,.item:focus-visible{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--lin);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sup);color:var(--ink2);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink)}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dia{background:var(--sup);border:1px solid var(--lin);border-radius:10px;padding:10px;min-height:110px}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--mut)}

.dia .ev{font-size:12.5px;padding:3px 0;border-top:1px solid var(--lin)}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mes .cd{font-size:12px;color:var(--mut);text-align:center;padding:2px}
.mes button{all:unset;cursor:pointer;background:var(--sup);border:1px solid var(--lin);border-radius:8px;padding:6px;min-height:74px;font-size:12px;display:block;overflow:hidden}
.mes button.fora{opacity:.45}
.mes button.hoje{box-shadow:inset 0 0 0 2px var(--mut)}
.mes .num{font-weight:600;font-size:12.5px}
.mes .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.mes .cnt{display:none;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--lin);background:var(--sup);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.hb{border:1px solid var(--lin);background:var(--sup);color:var(--ink);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:14px}
.hb[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.medidor{height:8px;border-radius:4px;background:var(--lin);overflow:hidden;margin:4px 0 10px}.medidor i{display:block;height:100%;background:var(--s1);border-radius:4px}
.pont{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;align-items:start}
.pont .num{font-size:54px;font-weight:650;line-height:1;letter-spacing:-.02em}
.tira{display:flex;gap:3px;align-items:flex-end;height:54px;margin-top:10px}
.tira div{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.tira i{display:block;background:var(--s1);border-radius:3px 3px 0 0;min-height:2px}.tira i.nf{background:var(--eixo)}
pre.det{white-space:pre-wrap;font:inherit;font-size:12.5px;color:var(--ink2);margin:4px 0 0}
@media (max-width:820px){.pont{grid-template-columns:1fr}}
.legenda{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.graf{width:100%;position:relative}
.graf svg{display:block;width:100%;touch-action:pan-y}
.nota{color:var(--mut);font-size:12.5px;margin:8px 0 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ink2);font-size:13px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--sup);border:1px solid var(--eixo);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.14);display:none;max-width:260px}
#tip b{display:block;font-size:14px}
#tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
#tip div{color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:10px 14px;border-radius:8px;font-size:13.5px;display:none;z-index:30;max-width:90vw}
dialog{border:1px solid var(--lin);border-radius:12px;background:var(--sup);color:var(--ink);padding:18px;width:min(460px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px}
label.c{display:block;margin:0 0 10px;font-size:12.5px;color:var(--ink2)}
label.c input,label.c select{display:block;width:100%;margin-top:3px;padding:8px;border:1px solid var(--eixo);border-radius:8px;background:var(--sup);color:var(--ink);font:inherit}
label.k{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13.5px}
.acoes{display:flex;gap:8px;align-items:center;margin-top:14px}
.acoes .esp{flex:1}
.erro{color:var(--cri);font-size:13px;min-height:1em}
.login{max-width:360px;margin:8vh auto}
@media (max-width:820px){
  .semana{grid-template-columns:1fr}.dia{min-height:0}
  .mes button{min-height:50px;padding:4px;text-align:center}.mes .ev{display:none}.mes .cnt{display:block}
  .tile .val{font-size:21px}
}
</style>

<body>
<header>
  <h1>Painel pessoal</h1><span class="data" id="dataHoje"></span><span class="esp"></span>
  <span class="modo" id="modo"></span><button class="b mini" id="sair" hidden data-act="sair">Terminar sessão</button>
</header>

<script>
/* ============================================================================
   CONFIGURAÇÃO
   Preencher com os dados do projeto Supabase (Project Settings > API):
   o URL do projeto e a chave pública ("publishable" ou "anon").
   NUNCA colocar aqui a chave "secret" / "service_role".
   Com os dois campos vazios, a app corre em modo local de demonstração:
   os dados ficam apenas neste navegador.
   ============================================================================ */
const VERSAO = '9 · 20/11/2026';
const CONFIG = {
  SUPABASE_URL: 'https://rpdwbxqalunmhfsgsbao.supabase.co',
  SUPABASE_KEY: 'sb_publishable_bHLohWmZHPBXqdVH9fPKcQ_vz6-zpyB',
  LINK_APP_RENDAS: 'https://claude.ai/artifact/SgTV3iyz83YPzAfeUeKFXb'  // ligação opcional mostrada no separador Apartamento
};

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v) || 0;
const soma = (a, f) => a.reduce((s, x) => s + num(f(x)), 0);
const eur = v => new Intl.NumberFormat('pt-PT', {style:'currency', currency:'EUR'}).format(num(v));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const hoje = () => iso(new Date());
const addDias = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const addMeses = (s, n) => { const d = pd(s), dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); };
const difDias = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const segunda = s => addDias(s, -((pd(s).getDay() + 6) % 7));
const fData = s => s ? String(s).slice(8, 10) + '/' + String(s).slice(5, 7) + '/' + String(s).slice(0, 4) : '—';
const fDM = s => String(s).slice(8, 10) + '/' + String(s).slice(5, 7);
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS = ['seg','ter','qua','qui','sex','sáb','dom'];
const fMes = k => MESES[Number(k.slice(5, 7)) - 1] + ' ' + k.slice(0, 4);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'l-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const lab = (lista, v) => (lista.find(o => o[0] === v) || [0, v ?? ''])[1];

/* ---------- listas de valores ---------- */
const AMBITO = [['empresa','Empresa'],['pessoal','Pessoal']];
const TIPO_MOV = [['despesa','Despesa'],['receita','Receita']];
const NATUREZA = [['variavel','Variável'],['fixa','Fixa']];
const PERIOD = [['mensal','Mensal'],['trimestral','Trimestral'],['semestral','Semestral'],['anual','Anual'],['unica','Única']];
const PASSO = {mensal:1, trimestral:3, semestral:6, anual:12};
const RECOR = [['nenhuma','Não se repete'],['diaria','Diária'],['semanal','Semanal'],['mensal','Mensal']];
const MODAL = [['natacao','Natação'],['ciclismo','Ciclismo'],['corrida','Corrida'],['forca','Força'],['mobilidade','Mobilidade'],['outro','Outro']];
const EST_PROC = [['em_curso','Em curso'],['suspenso','Suspenso'],['concluido','Concluído']];
const EST_PROP = [['pendente','Pendente'],['adjudicada','Adjudicada'],['recusada','Recusada']];
const TIPO_PROC = ['Relatório de patologias','Caderno de encargos','Mapa de trabalhos e quantidades','Fiscalização','Parecer técnico','Peritagem','Licenciamento','Outro'].map(x => [x, x]);
const TIPO_APT = [['renda','Renda'],['agua','Água'],['luz','Luz']];
const EST_APT = [['pendente','Pendente'],['pago','Pago']];
const TIPO_HAB = [['bom','Bom hábito'],['mau','Mau hábito']];

/* ---------- formulários (um por tabela) ---------- */
const FORMS = {
  contas: {titulo:'Conta', campos:[{k:'ambito',l:'Âmbito',t:'select',o:AMBITO},{k:'nome',l:'Nome da conta',t:'text',req:1},{k:'saldo',l:'Saldo (€)',t:'money',req:1},{k:'atualizado_em',l:'Saldo à data de',t:'date',def:'hoje'}]},
  movimentos: {titulo:'Movimento', campos:[{k:'ambito',l:'Âmbito',t:'select',o:AMBITO},{k:'tipo',l:'Tipo',t:'select',o:TIPO_MOV},{k:'natureza',l:'Natureza',t:'select',o:NATUREZA},{k:'descricao',l:'Descrição',t:'text',req:1},{k:'categoria',l:'Categoria',t:'text'},{k:'valor',l:'Valor (€)',t:'money',req:1},{k:'data',l:'Data',t:'date',req:1,def:'hoje'},{k:'entidade',l:'Entidade',t:'text'},{k:'pago',l:'Pago',t:'check',def:true},{k:'data_pagamento',l:'Data de pagamento',t:'date'}]},
  obrigacoes: {titulo:'Obrigação', campos:[{k:'ambito',l:'Âmbito',t:'select',o:AMBITO},{k:'descricao',l:'Descrição',t:'text',req:1},{k:'valor',l:'Valor (€)',t:'money',req:1},{k:'periodicidade',l:'Periodicidade',t:'select',o:PERIOD},{k:'proximo_vencimento',l:'Próximo vencimento',t:'date',req:1},{k:'ativo',l:'Ativa',t:'check',def:true}]},
  faturas: {titulo:'Fatura', campos:[{k:'numero',l:'N.º da fatura',t:'text'},{k:'cliente',l:'Cliente',t:'text',req:1},{k:'descricao',l:'Descrição',t:'text'},{k:'valor',l:'Valor (€)',t:'money',req:1},{k:'data_emissao',l:'Data de emissão',t:'date',req:1,def:'hoje'},{k:'data_vencimento',l:'Data de vencimento',t:'date'},{k:'data_recebimento',l:'Data de recebimento (vazio = por receber)',t:'date'},{k:'valor_recebido',l:'Valor já recebido (€) — vazio = total, se houver data de recebimento',t:'money'}]},
  processos: {titulo:'Processo', campos:[{k:'referencia',l:'Referência',t:'text'},{k:'nome',l:'Designação',t:'text',req:1},{k:'cliente',l:'Cliente',t:'text'},{k:'tipo',l:'Tipo de serviço',t:'select',o:TIPO_PROC},{k:'fase',l:'Fase atual',t:'text'},{k:'prazo',l:'Prazo',t:'date'},{k:'estado',l:'Estado',t:'select',o:EST_PROC}]},
  propostas: {titulo:'Proposta', campos:[{k:'referencia',l:'Referência',t:'text'},{k:'cliente',l:'Cliente',t:'text',req:1},{k:'descricao',l:'Descrição',t:'text'},{k:'valor',l:'Valor (€)',t:'money'},{k:'data_envio',l:'Data de envio',t:'date',req:1,def:'hoje'},{k:'estado',l:'Estado',t:'select',o:EST_PROP}]},
  compromissos: {titulo:'Compromisso', campos:[{k:'titulo',l:'Título',t:'text',req:1},{k:'data',l:'Data',t:'date',req:1,def:'hoje'},{k:'hora',l:'Hora (vazio = dia inteiro)',t:'time'},{k:'recorrencia',l:'Repetição',t:'select',o:RECOR},{k:'notas',l:'Notas',t:'text'}]},
  apartamento_registos: {titulo:'Apartamento', campos:[{k:'mes',l:'Mês (AAAA-MM)',t:'month',req:1},{k:'tipo',l:'Tipo',t:'select',o:TIPO_APT},{k:'valor',l:'Valor (€)',t:'money'},{k:'estado',l:'Estado',t:'select',o:EST_APT},{k:'data_pagamento',l:'Data de pagamento',t:'date'}]},
  treinos: {titulo:'Sessão de treino', campos:[{k:'data',l:'Data',t:'date',req:1,def:'hoje'},{k:'modalidade',l:'Modalidade',t:'select',o:MODAL},{k:'descricao',l:'Descrição',t:'text'},{k:'duracao_min',l:'Duração (min)',t:'int'},{k:'distancia_km',l:'Distância (km)',t:'money'},{k:'feito',l:'Realizada',t:'check'}]},
  dividas: {titulo:'Valor a pagar', campos:[{k:'tipo',l:'Tipo',t:'select',o:[['comissao','Comissão'],['outra','Outra']]},{k:'numero',l:'N.º / referência',t:'text'},{k:'entidade',l:'Entidade',t:'text',req:1},{k:'descricao',l:'Descrição',t:'text'},{k:'processo',l:'Processo',t:'text'},{k:'valor',l:'Valor (€)',t:'money',req:1},{k:'valor_pago',l:'Valor já pago (€)',t:'money',zero:1},{k:'data',l:'Data',t:'date',req:1,def:'hoje'}]},
  habitos: {titulo:'Hábito', campos:[{k:'nome',l:'Nome',t:'text',req:1},{k:'tipo',l:'Tipo',t:'select',o:TIPO_HAB},{k:'unidade',l:'Unidade a contar (opcional), por exemplo: cigarros',t:'text'},{k:'auto',l:'Marcar automaticamente com dados do Garmin',t:'select',o:[[null,'Não'],['exercicio','Quando houver uma atividade no dia'],['passos','Quando os passos atingirem a meta']]},{k:'meta',l:'Meta de passos por dia',t:'money'},{k:'ativo',l:'Ativo',t:'check',def:true}]}
};
const TABELAS = [...Object.keys(FORMS), 'habitos_registos', 'eventos_calendario', 'dias_fechados', 'garmin_bem_estar', 'garmin_atividades'];

/* ---------- armazenamento: Supabase ou local ---------- */
const db = {}; TABELAS.forEach(t => db[t] = []);
let sb = null, memoriaApenas = false;
const CHAVE_LOCAL = 'painel-pessoal-v1';
function guardarLocal() { try { localStorage.setItem(CHAVE_LOCAL, JSON.stringify(db)); } catch (e) { memoriaApenas = true; } }
async function carregarTudo() {
  if (sb) {
    const res = await Promise.all(TABELAS.map(t => sb.from(t).select('*')));
    res.forEach((r, i) => { if (r.error) throw r.error; db[TABELAS[i]] = r.data || []; });
  } else {
    try { const d = JSON.parse(localStorage.getItem(CHAVE_LOCAL) || '{}'); TABELAS.forEach(t => db[t] = Array.isArray(d[t]) ? d[t] : []); }
    catch (e) { memoriaApenas = true; }
  }
}
async function inserir(t, linha) {
  if (sb) { const {data, error} = await sb.from(t).insert(linha).select().single(); if (error) throw error; db[t].push(data); return data; }
  if (t === 'apartamento_registos' && db[t].some(r => r.mes === linha.mes && r.tipo === linha.tipo)) throw new Error('Já existe um registo para esse mês e tipo.');
  const l = {id: uuid(), created_at: new Date().toISOString(), ...linha}; db[t].push(l); guardarLocal(); return l;
}
async function atualizar(t, id, dados) {
  const i = db[t].findIndex(r => r.id === id); if (i < 0) return;
  if (sb) { const {data, error} = await sb.from(t).update(dados).eq('id', id).select().single(); if (error) throw error; db[t][i] = data; return data; }
  db[t][i] = {...db[t][i], ...dados}; guardarLocal(); return db[t][i];
}
async function eliminar(t, id) {
  if (sb) { const {error} = await sb.from(t).delete().eq('id', id); if (error) throw error; }
  db[t] = db[t].filter(r => r.id !== id);
  if (t === 'habitos') db.habitos_registos = db.habitos_registos.filter(r => r.habito_id !== id);
  if (!sb) guardarLocal();
}

function campoHtml(c, v) {

  const tipo = {money:'text', int:'number', date:'date', time:'time', month:'month', text:'text'}[c.t];
  const extra = c.t === 'money' ? ' inputmode="decimal" placeholder="0,00"' : c.t === 'int' ? ' min="0" step="1"' : c.t === 'month' ? ' pattern="\\d{4}-\\d{2}" placeholder="AAAA-MM"' : '';

function interpretarRapido(txt) {
  const m = txt.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os)?)?/i); if (!m) throw new Error('Indique um valor, por exemplo: 45 € combustível empresa.');
  let resto = (txt.slice(0, m.index) + ' ' + txt.slice(m.index + m[0].length)).trim();
  const tem = re => { const x = re.test(resto); resto = resto.replace(re, ' '); return x; };
  const empresa = tem(/\b(da\s+)?empresa\b/i); tem(/\bpessoal\b/i);
  const receita = tem(/\breceita\b/i); tem(/\bdespesa\b/i);
  const fixa = tem(/\bfixa\b/i); tem(/\bvari[aá]vel\b/i);
  const ontem = tem(/\bontem\b/i); tem(/\bhoje\b/i);
  resto = resto.replace(/^\s*(de|em|com)\s+/i, '').replace(/\s+/g, ' ').trim();
  const cat = (db.movimentos.find(x => x.categoria && resto && x.categoria.toLowerCase() === resto.toLowerCase()) || {}).categoria || null;
  return {ambito: empresa ? 'empresa' : 'pessoal', tipo: receita ? 'receita' : 'despesa', natureza: fixa ? 'fixa' : 'variavel', descricao: resto ? resto[0].toUpperCase() + resto.slice(1) : '', categoria: cat, valor: Number(m[1].replace(',', '.')), data: ontem ? addDias(hoje(), -1) : hoje(), pago: true};
}

(async function arrancar() {
  $('#dataHoje').textContent = new Date().toLocaleDateString('pt-PT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) {
    $('#modo').textContent = 'v' + VERSAO;
    try {
      await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
      const {data, error} = await sb.auth.getSession(); if (error) throw error;
      if (data.session) entrar(); else ecraLogin();
    } catch (err) { sb = null; $('#app').innerHTML = `<div class="aviso"><b>Falha na ligação ao Supabase.</b> ${esc(msgErro(err))}</div>`; }
  } else { $('#modo').textContent = 'Modo local · v' + VERSAO; entrar(); }
})();
</script>
</body>
</html>
